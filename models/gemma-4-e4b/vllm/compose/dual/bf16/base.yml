# ===========================================================================
# Profile (at-a-glance):
#   Model:     Gemma-4-E4B-it (bf16 — google/gemma-4-E4B-it, ~8B raw / ~4.5B effective params)
#   Engine:    vLLM (vllm/vllm-openai:v0.25.1 — vllm-stable, OVERLAY-FREE)
#   Topology:  Dual 3090 PCIe (TP=2, NVLink auto-detected via NVLINK_MODE; PCIe ->
#              --disable-custom-all-reduce auto-injected)
#   Drafter:   none — MTP assistant drafter exists upstream (google/gemma-4-E4B-it-assistant,
#              ~0.16 GB) but is shipped DISABLED family-wide on vllm-stable (see caveat).
#   KV:        bf16 (engine-default). This model does NOT need int8-PTH/fp8: num_kv_heads=2
#              keeps even untied (K != V) KV tiny — no reason to touch the Gemma-4 hetero-head
#              int8-PTH recall-cratering bug (#40391, open) that 31B has to work around.
#   Vision:    yes (text + image + audio capable; served with no special mm flags, matching
#              the 12B/31B convention — vLLM's multimodal processor handles it transparently)
#   Max ctx:   65536 (64K) per stream @ max_num_seqs=8 — sized so 8 FULL-length concurrent
#              streams fit the projected KV budget with ~39% headroom (hand-derived, see KV
#              math below; kv-calc.py does not model this spec — see profile YAML). Model's
#              real ceiling is 131072 (128K); raise MAX_MODEL_LEN and re-verify once a real
#              boot log's "Available KV cache" line confirms the true pool (projected
#              theoretical ceiling at seqs=8 is ~100K+/stream).
#   Genesis:   N/A — Genesis is Qwen3-Next-specific
#   Status:    🐣 Incubating
#   Caveats:   (1) UNVALIDATED on real hardware — authored without access to a dual-RTX-3090
#              Linux rig (this catalog entry was built on a Windows dev workstation with an
#              unrelated GPU). No boot log, no verify-full, no bench, no calibration yet.
#              (2) MTP (speculative decoding) shipped DISABLED — Gemma-4 MTP × tool-calling is
#              broken upstream (vLLM #39043; fix #42006 closed-unmerged, only vendored on the
#              older vllm-gemma-stable v0.22.0 engine) — same family-wide issue affecting
#              gemma-31b-dual and gemma-4-12b-dual-mtp. Re-enable trigger + restore snippet in
#              the commented block at the end of `command:` below.
#              (3) attention_k_eq_v=false on THIS model only (siblings are all tied) — every KV
#              estimate here uses k_v_tensors=2; do not copy sizing intuition from 12B/26B-A4B/31B.
#              (4) Run docs/ADDING_MODELS.md Steps 5-8 (boot, verify-full, verify-stress, bench,
#              calibrate) before promoting past Incubating.
#   Best for:  a multi-tenant agent fleet on dual 3090 — 8 concurrent streams @ 64K context each,
#              vision + native tool-calling, the lightest model in the Gemma 4 family (huge VRAM
#              headroom vs 12B/26B-A4B/31B: ~7.5 GB/card weights at TP=2 vs 31B's ~9-29 GB/card).
# ---------------------------------------------------------------------------
# Gemma-4-E4B-it on 2x RTX 3090 TP=2, stock vLLM v0.25.1 (vllm-stable, no vendored overlays).
#
# WHY bf16 (only option today): Intel AutoRound and cyankiwi AWQ — the usual third-party
# quantizers for this family — have NOT released gemma-4-E4B-it variants yet (confirmed via
# authenticated HF API lookup: both 404 as of this writing). Not urgent either way: bf16
# weights are only ~7.45 GB/card at TP=2 (7,996,156,490 params measured from the safetensors
# index), leaving huge headroom on 24 GB cards without quantization.
#
# WHY vllm-stable (not vllm-gemma-stable): this model's KV footprint is tiny even at bf16
# (num_kv_heads=2 vs 31B's 16), so there's no need for the int8-PTH long-context unlock that
# forces 31B onto the older, overlay-carrying vllm-gemma-stable engine. Staying on vllm-stable
# means zero vendored patches — simplest possible integration, and matches the CURRENT
# direction for Gemma-4 dense composes (gemma-31b-dual already made this same move in the
# 2026-07-02 v0.24.0 consolidation).
#
# KV math (hand-derived — kv-calc.py's gemma4-swa-dense branch hardcodes k_v_tensors=1 for
# K==V-tied models, which does NOT apply here; see scripts/lib/profiles/models/gemma-4-e4b.yml
# for the full explanation of why C12/kv-calc is intentionally not wired for this model yet):
#   growing (7 full-attn layers, global_head_dim=512, k_v_tensors=2, bf16 bpe=2):
#     per_token_TP1 = 7 x 2(kv_heads) x 512 x 2(untied) x 2(bpe) = 28,672 B/token
#     per_token_TP2_per_card = 14,336 B/token/card
#   sliding-fixed (35 layers, head_dim=256, window=512, k_v_tensors=2, bf16):
#     total_TP1 = 35 x 2 x 256 x 2 x 2 x 512 = 36,700,160 B (~35 MB) -> ~17.5 MB/card at TP=2
#     (negligible either way)
#   Per-card budget @ 24 GB x 0.92 mem_util = 22.08 GB:
#     weights/2 ~7.45 GB, cudagraph+overhead ~1.72 GB (shared family empirical fit:
#     0.5 + 1.0*mem_util + 0.3*(TP-1)), activation peak ~1.5 GB (projected — no
#     calibration anchor yet; closest analog is 26B-A4B's "~1-2 GB", NOT 31B's larger
#     ~1.5-2.5 GB), sliding-fixed ~0.02 GB -> ~11.39 GB/card left for growing KV pool.
#   Max total tokens (ctx x seqs) = 11.39 GiB / 14,336 B ~= 853,175 -> at seqs=8,
#   ceiling ~106K/stream. Shipped at 65536 (~61% of that pool) for margin against the
#   above being an estimate, not a measurement.
#
# Weights: hf download google/gemma-4-E4B-it --local-dir $MODEL_DIR/gemma-4-e4b-it
# Drafter (unused while MTP is disabled, but referenced by the commented re-enable block):
#   hf download google/gemma-4-E4B-it-assistant --local-dir $MODEL_DIR/gemma-4-e4b-it-assistant
#
# Hardware metadata (parsed by scripts/preflight.sh):
# Requires-min-vram-gb: 24
# Engine-profile: vllm-stable
# Requires-min-gpu-count: 2
# Tensor-parallel: 2
services:
  vllm-gemma-4-e4b-dual:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.25.1}
    container_name: "${ESTATE_CONTAINER:-vllm-gemma-4-e4b-dual}"
    restart: ${CLUB3090_RESTART:-unless-stopped}
    ports:
      - "${BIND_HOST:-0.0.0.0}:${ESTATE_PORT:-${PORT:-8200}}:8000"
    volumes:
      - ${MODEL_DIR:-../../../../../../models-cache}:/root/.cache/huggingface
      # Google Gemma 4 CANONICAL chat template (published 2026-07-09) — SHARED from the
      # gemma-4-31b tree (one canonical template family-wide); the image-bundled example
      # predates Google's fix (see the patch README).
      - ../../../../../gemma-4-31b/vllm/patches/google-canonical-chat-template/chat_template.jinja:/etc/club3090/gemma-canonical-template.jinja:ro
      - ../../../cache/torch_compile:/root/.cache/vllm/torch_compile_cache
      - ../../../cache/triton:/root/.triton/cache
      - ../../../../../../scripts/detect_nvlink.sh:/etc/club3090/detect_nvlink.sh:ro
      # NO overlay mounts — overlay-free on stock v0.25.1 (bf16 KV needs no patch;
      # this model never needs the #40391/#42006 vllm-gemma-stable overlays 31B carries).
    environment:
      - NVIDIA_VISIBLE_DEVICES=${ESTATE_GPUS:-${NVIDIA_VISIBLE_DEVICES:-all}}
      # CUDA-level GPU mask — the runtime-agnostic half of GPU selection (#610):
      # launch.sh --gpus exports GPU UUIDs here. CDI runtimes (NixOS, nvidia-ctk cdi)
      # IGNORE NVIDIA_VISIBLE_DEVICES, so this mask is what actually pins cards there;
      # on the classic runtime the UUID form is renumbering-proof. Unset -> absent.
      - CUDA_VISIBLE_DEVICES
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-${OFFLINE:-0}}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-${OFFLINE:-0}}
      - VLLM_WORKER_MULTIPROC_METHOD=spawn
      - NVLINK_MODE=${NVLINK_MODE:-auto}
      - NCCL_CUMEM_ENABLE=0
      - NCCL_P2P_DISABLE=1
      - VLLM_NO_USAGE_STATS=1
      - OMP_NUM_THREADS=1
      - PYTORCH_CUDA_ALLOC_CONF=${PYTORCH_CUDA_ALLOC_CONF:-expandable_segments:True,max_split_size_mb:512}
      - VLLM_ALLOW_LONG_MAX_MODEL_LEN=1
      - TRITON_CACHE_DIR=/root/.triton/cache
    shm_size: "16gb"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    entrypoint:
      - /bin/bash
      - -c
      - |
        # Overlay-free on v0.25.1 — no boot-time patch apply. NVLink autodetect + serve.
        source /etc/club3090/detect_nvlink.sh
        if [ "$${_NVLINK_ENABLED:-0}" = "1" ]; then
          exec vllm serve "$$@"
        else
          exec vllm serve --disable-custom-all-reduce "$$@"
        fi
      - --
    command:
      - --override-generation-config
      - '{"temperature":${TEMP:-${TEMPERATURE:-1.0}},"top_p":${TOP_P:-0.95},"top_k":${TOP_K:-64},"min_p":${MIN_P:-0.0},"repetition_penalty":${REPEAT_PENALTY:-1.0}}'
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --model
      - /root/.cache/huggingface/${MODEL_SUBDIR:-gemma-4-e4b-it}
      - --served-model-name
      - ${SERVED_NAME:-gemma-4-e4b}
      - --tensor-parallel-size
      - "${TP:-2}"
      - --pipeline-parallel-size
      - "${PP:-1}"
      # ---- KV format: bf16 (engine-default). `auto` resolves to the model dtype (bf16).
      #      No int8-PTH/fp8 override offered here — this model's num_kv_heads=2 keeps bf16
      #      KV cheap; skip the Gemma-4 hetero-head int8-PTH recall cliff entirely (#40391).
      - --kv-cache-dtype
      - "${KV_DTYPE:-auto}"
      # ---- max-model-len: hand-derived ceiling for 8 FULL-length concurrent streams — see
      #      the KV math block above. Model's real max is 131072; raise MAX_MODEL_LEN toward
      #      it only after confirming the real boot-log KV pool (docs/ADDING_MODELS.md Step 5).
      - --max-model-len
      - "${MAX_MODEL_LEN:-${CTX:-65536}}"
      - --gpu-memory-utilization
      - "${GPU_MEMORY_UTILIZATION:-0.92}"
      # 8 concurrent streams — the whole point of this compose. Lower it (or raise ctx) if
      # your workload needs deeper individual conversations instead of more parallel agents.
      - --max-num-seqs
      - "${MAX_NUM_SEQS:-8}"
      - --max-num-batched-tokens
      - "${MAX_NUM_BATCHED_TOKENS:-4096}"
      - --trust-remote-code
      # Tool-call support — native gemma4 ParserEngine on vllm-stable v0.25.1.
      - --enable-auto-tool-choice
      - --tool-call-parser
      - gemma4
      # Route Gemma-4's <|channel>thought...<channel|> reasoning into reasoning_content.
      - --reasoning-parser
      - gemma4
      - --chat-template
      - /etc/club3090/gemma-canonical-template.jinja
      # ⏸️ MTP disabled — Gemma-4 MTP x tool-calling is broken on stock vllm-stable (vLLM
      #    #39043; fix #42006 closed-unmerged, not in v0.25.1). Do NOT add --speculative-config
      #    below until a stable vLLM release carries the fix. Check:
      #      gh api repos/vllm-project/vllm/issues/39043 --jq '.state, .state_reason'
      #      gh api repos/vllm-project/vllm/pulls/42006  --jq '.state, .merged_at'
      #    Then restore this (drafter is ~0.16 GB — nearly free at TP=2) and re-run a
      #    streaming multi-tool-call test (must return all args, no <|tool_call> leak)
      #    before shipping:
      #      - --speculative-config
      #      - '{"model":"/root/.cache/huggingface/gemma-4-e4b-it-assistant","num_speculative_tokens":${SPEC_N:-4}}'
