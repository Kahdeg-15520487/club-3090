# ===========================================================================
# Profile (at-a-glance):
#   Model:     Artemis-31B-v1m (BeaverAI uncensored fine-tune of Gemma-4-31B, Q4_K_M GGUF)
#   Engine:    beellama.cpp (Anbeeld llama.cpp fork — DFlash spec-dec + SWA windowed KV)
#   Topology:  Dual 3090 (layer-split across both cards, PCIe — no NVLink needed)
#   Drafter:   none (DFlash incompatible — Artemis has different vocab than base Gemma)
#   KV:        q5_0 K + q4_1 V
#   Vision:    no
#   Template:  native (GGUF-embedded) via --jinja
#   Max ctx:   131072 default (conservative for fine-tune; lower CTX_SIZE if OOM)
#   Genesis:   N/A — beellama is a llama.cpp-family engine
#   Status:    🧪 EXPERIMENTAL — local preset, NOT cataloged. Boots with --force.
#              Based on beellama/gemma-dflash-dual template. Same DFlash draft
#              (gemma-4-31b architecture match). Not yet validated.
#   Caveats:   DFlash NOT available — Artemis fine-tune has different vocabulary
#              (32256 vs base Gemma 25600), so Anbeeld's DFlash draft is incompatible.
#              Runs without spec-dec. ~3-4× slower than DFlash would be. Unvalidated.
#   Best for:  Uncensored Gemma-4-31B fine-tune — creative writing, roleplay (no spec-dec)
# ---------------------------------------------------------------------------
# Artemis-31B-v1m on beellama.cpp — DUAL 3090, Q4_K_M + DFlash (Anbeeld IQ4_XS draft),
# q5_0/q4_1 KV, layer-split across both cards, 131K ctx.
#
# This is a local preset — NOT in the catalog registry. Boot directly:
#   bash scripts/switch.sh --force beellama/artemis-dual-dflash   (after registering)
# Or boot via docker compose:
#   MODEL_DIR=/mnt/fast1/lll/text-generation-webui/user_data/models \
#     docker compose -f models/gemma-4-31b/beellama/compose/dual/artemis-q4km-dflash/dflash.yml up -d
#
# First download the GGUFs:
#   cd $MODEL_DIR
#   mkdir -p artemis-31b-gguf gemma-4-31b-gguf/anbeeld-dflash-iq4xs
#   hf download BeaverAI/Artemis-31B-v1m-GGUF Artemis-31B-v1m-Q4_K_M.gguf \
#     --local-dir artemis-31b-gguf
#   hf download Anbeeld/gemma-4-31B-it-DFlash-GGUF gemma4-31b-it-dflash-Q4_K_M.gguf \
#     --local-dir gemma-4-31b-gguf/anbeeld-dflash-iq4xs
#
# Override via .env or shell:
#   MODEL_DIR       host dir mounted as /models
#   GGUF_FILE       target GGUF under /models (default: artemis-31b-gguf/Artemis-31B-v1m-Q4_K_M.gguf)
#   DRAFT_FILE      DFlash draft GGUF under /models
#   CTX_SIZE        KV pool size (default: 131072)
#   PORT            host port (default: 8064)
#   REASONING       thinking gate (default: off)
services:
  beellama-artemis-31b-dual:
    image: ${BEELLAMA_IMAGE:-ghcr.io/noonghunna/beellama-cpp:multiarch-v0.3.0-efe856397}
    container_name: "${ESTATE_CONTAINER:-beellama-artemis-31b-dual}"
    restart: unless-stopped
    ports:
      - "${ESTATE_PORT:-${PORT:-8037}}:8080"
    volumes:
      - "${MODEL_DIR:-../../../../../../models-cache}:/models:ro"
    command: >-
      --host 0.0.0.0
      --port 8080
      -m /models/${GGUF_FILE:-artemis-31b-gguf/Artemis-31B-v1m-Q4_K_M.gguf}
      -ngl all
      --split-mode ${SPLIT_MODE:-layer}
      --main-gpu ${MAIN_GPU:-0}
      --ctx-size ${CTX_SIZE:-131072}
      -b ${BATCH_SIZE:-2048}
      -ub ${UBATCH_SIZE:-512}
      -np ${NP:-1}
      --kv-unified
      --cache-type-k ${KV_TYPE_K:-q5_0}
      --cache-type-v ${KV_TYPE_V:-q4_1}
      --flash-attn on
      --cache-ram 0
      --no-host
      --jinja
      --reasoning ${REASONING:-off}
      --temp ${TEMP:-${TEMPERATURE:-1.0}}
      --top-k ${TOP_K:-64}
      --top-p ${TOP_P:-0.95}
      --min-p ${MIN_P:-0.0}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
