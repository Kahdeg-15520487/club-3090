# ===========================================================================
# Profile (at-a-glance):
#   Model:     Gemma-4-Gembrain-X-31B (Nimbz merge of 12+ RP/creative fine-tunes, Q4_K_M GGUF)
#   Engine:    beellama.cpp (Anbeeld llama.cpp fork — SWA windowed KV)
#   Topology:  Dual 3090 (layer-split across both cards, PCIe — no NVLink needed)
#   Drafter:   none (no compatible DFlash draft; Gembrain likely has different vocab)
#   KV:        q5_0 K + q4_1 V
#   Vision:    no
#   Template:  native (GGUF-embedded) via --jinja
#   Max ctx:   131072 default
#   Genesis:   N/A — beellama is a llama.cpp-family engine
#   Status:    🐣 Incubating — local preset, not validated
#   Best for:  Uncensored creative writing + RP — merge of Gemsicle, Garnet,
#              Monika, Musica, Equinox, and 8+ other Gemma-4 fine-tunes
# ---------------------------------------------------------------------------
# Gemma-4-Gembrain-X-31B on beellama.cpp — DUAL 3090, Q4_K_M GGUF, layer-split.
#
# Download:
#   cd $MODEL_DIR
#   mkdir -p gembrain-x-31b-gguf
#   hf download Nimbz/Gemma-4-Gembrain-X-31B-GGUF \
#     imatrix/Gembrain-X-31B-Q4_K_M-imatrix.gguf --local-dir gembrain-x-31b-gguf
#
# Boot:
#   bash scripts/switch.sh --force beellama/gembrain-x-dual-q4km
#
# Override via .env or shell:
#   MODEL_DIR   host dir mounted as /models
#   CTX_SIZE    KV pool size (default: 131072)
#   PORT        host port (default: 8202)
services:
  beellama-gembrain-x-31b-dual:
    image: ${BEELLAMA_IMAGE:-ghcr.io/noonghunna/beellama-cpp:multiarch-v0.3.0-efe856397}
    container_name: "${ESTATE_CONTAINER:-beellama-gembrain-x-31b-dual}"
    restart: unless-stopped
    ports:
      - "${ESTATE_PORT:-${PORT:-8202}}:8080"
    volumes:
      - "${MODEL_DIR:-../../../../../../models-cache}:/models:ro"
    command: >-
      --host 0.0.0.0
      --port 8080
      -m /models/${GGUF_FILE:-gembrain-x-31b-gguf/imatrix/Gembrain-X-31B-Q4_K_M-imatrix.gguf}
      -ngl all
      --split-mode ${SPLIT_MODE:-layer}
      --main-gpu ${MAIN_GPU:-0}
      --ctx-size ${CTX_SIZE:-131072}
      -b ${BATCH_SIZE:-2048}
      -ub ${UBATCH_SIZE:-512}
      -np ${NP:-1}
      --kv-unified
      --cache-type-k ${KV_TYPE_K:-q5_0}
      --cache-type-v ${KV_TYPE_V:-q4_1}
      --flash-attn on
      --cache-ram 0
      --no-host
      --jinja
      --temp ${TEMP:-${TEMPERATURE:-1.0}}
      --top-k ${TOP_K:-64}
      --top-p ${TOP_P:-0.95}
      --min-p ${MIN_P:-0.0}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
